name: Lotto purchase 1 game

on:
  schedule:
    # 매주 월요일 19:00 KST = 월요일 10:00 UTC
    - cron: '0 10 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  purchase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh latest draw data
        run: python controller.py refresh_lotto_data

      - name: Purchase 1 recommended lotto game
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            echo "[purchase] attempt ${attempt}/2"
            if make buy_lotto; then
              exit 0
            fi

            if [ "$attempt" -lt 2 ]; then
              echo "[purchase] transient failure, retrying after 20s"
              sleep 20
            fi
          done

          echo "[purchase] failed after 2 attempts"
          exit 1
        env:
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
          COUNT: '1'
          LOTTO_MODE: RECOMMENDED
          LOTTO_STRATEGY: hybrid
          LOTTO_HTTP_CONNECT_TIMEOUT: '45'
          LOTTO_HTTP_READ_TIMEOUT: '60'
          LOTTO_HTTP_RETRIES: '5'
          LOTTO_HTTP_READ_RETRIES: '3'
          LOTTO_HTTP_BACKOFF: '1.5'
